<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuantMate — Register</title>
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.tailwindcss.com?v=3.4"></script>
  <style>
    .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:hsl(var(--background));padding:16px}
    .auth-card{width:100%;max-width:480px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:16px;padding:32px;box-shadow:0 10px 30px hsl(var(--foreground)/.08)}
    .auth-logo{display:flex;justify-content:center;margin-bottom:24px;font-size:28px;font-weight:700;color:hsl(var(--primary))}
  </style>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">QuantMate宽盟</div>
    <h1 style="font-size:28px;font-weight:700;text-align:center;margin:0 0 8px">Create Account</h1>
    <p class="text-muted" style="text-align:center;margin:0 0 24px">Join QuantMate to start strategy research, backtesting, and portfolio workflows.</p>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div><label class="form-label">Username</label><input class="form-input"></div>
      <div><label class="form-label">Email</label><input class="form-input" type="email"></div>
      <div><label class="form-label">Password</label><input class="form-input" type="password"></div>
      <div><label class="form-label">Confirm Password</label><input class="form-input" type="password"></div>
      <button class="btn btn-primary" style="width:100%" onclick="showToast('Account created. Redirecting to login...','success')">Create Account</button>
    </div>
    <p style="margin:20px 0 0;text-align:center;font-size:14px;color:hsl(var(--muted-foreground))">Already have an account? <a href="login.html" style="color:hsl(var(--primary));text-decoration:none;font-weight:600">Sign In</a></p>
  </div>
</div>
<script src="shared.js"></script>
</body>
</html>
