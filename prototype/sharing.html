<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuantMate — Team Space</title>
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.tailwindcss.com?v=3.4"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="main">

    <div class="page-header">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div>
          <h1 class="page-title">Team Space</h1>
          <p class="page-subtitle">Collaborative workspaces, member management, and strategy sharing</p>
        </div>
        <button class="btn btn-primary" id="btnCreateWs" onclick="openModal('createWs')">+ Create Workspace</button>
      </div>
    </div>

    <!-- Workspace List View -->
    <div id="workspaceList"></div>

    <!-- Member Detail View -->
    <div id="memberDetail" style="display:none"></div>

  </main>
</div>

<!-- Create Workspace Modal -->
<div class="modal-overlay" id="createWs">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 class="modal-title">Create Workspace</h3>
      <button class="btn btn-ghost btn-icon" onclick="closeModal('createWs')">&#10005;</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div>
          <label class="form-label">Workspace Name</label>
          <input type="text" class="form-input" placeholder="Enter workspace name">
        </div>
        <div>
          <label class="form-label">Description</label>
          <textarea class="form-textarea" rows="4" placeholder="Describe the purpose of this workspace..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('createWs')">Cancel</button>
      <button class="btn btn-primary" onclick="submitModal('createWs', 'Workspace created successfully', 'success')">Create</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>

];

    { username: 'Daniel Shi', email: 'daniel@quantmate.io', role: 'admin', joined_at: '2025-12-01', last_active: '2026-03-25' },
    { username: 'Mike Zhao', email: 'mike@quantmate.io', role: 'member', joined_at: '2025-12-15', last_active: '2026-03-23' },

function roleBadge(role) {
  var variant = 'primary';
  if (role === 'owner') variant = 'destructive';
  else if (role === 'admin') variant = 'warning';
  var label = role.charAt(0).toUpperCase() + role.slice(1);
  return '<span class="badge badge-' + variant + '">' + label + '</span>';
}

function renderWorkspaceList() {
  var container = document.getElementById('workspaceList');
  var html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px">';
  for (var i = 0; i < workspaces.length; i++) {
    var ws = workspaces[i];
    html += '<div class="card" style="cursor:pointer;transition:box-shadow .2s" onmouseover="this.style.boxShadow=\'0 4px 12px rgba(0,0,0,.1)\'" onmouseout="this.style.boxShadow=\'\'" onclick="showMembers(\'' + ws.id + '\')">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
      + '<h3 style="font-weight:600;font-size:16px">' + ws.name + '</h3>'
      + roleBadge(ws.role)
      + '</div>'
      + '<p class="text-muted" style="font-size:13px;margin-bottom:16px">' + ws.description + '</p>'
      + '<div style="display:flex;gap:20px;font-size:13px;color:var(--muted-foreground)">'
      + '<span>' + icon('users') + ' ' + ws.members + ' members</span>'
      + '<span>' + ws.strategies + ' strategies</span>'
      + '<span>Created ' + ws.created_at + '</span>'
      + '</div>'
      + '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function showMembers(wsId) {
  var ws = null;
  for (var i = 0; i < workspaces.length; i++) {
    if (workspaces[i].id === wsId) { ws = workspaces[i]; break; }
  }
  if (!ws) return;

  var members = membersByWs[wsId] || [];
  document.getElementById('workspaceList').style.display = 'none';
  var detail = document.getElementById('memberDetail');
  detail.style.display = 'block';

  var html = '<a href="#" style="font-size:14px;color:var(--primary);text-decoration:none" onclick="backToList();return false">'
    + '← Back to workspace list</a>'
    + '<div class="card" style="margin-top:16px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'
    + '<h3 style="font-weight:600;font-size:16px">' + ws.name + ' — Member Management</h3>'
    + '<button class="btn btn-primary btn-sm" onclick="showToast(\'Invite link copied!\', \'success\')">'
    + icon('plus') + ' Invite Member</button>'
    + '</div>'
    + '<div class="table-wrap"><table><thead><tr>'
    + '<th>Member</th><th>Email</th><th>Role</th><th>Joined At</th><th>Last Active</th><th>Actions</th>'
    + '</tr></thead><tbody>';

  for (var j = 0; j < members.length; j++) {
    var m = members[j];
    var actionCell = '';
    if (m.role !== 'owner') {
      actionCell = '<button class="btn btn-ghost btn-icon btn-sm" onclick="showToast(\'Member settings opened\', \'info\')">'
        + icon('settings') + '</button>';
    }
    html += '<tr>'
      + '<td style="font-weight:500">' + m.username + '</td>'
      + '<td>' + m.email + '</td>'
      + '<td>' + roleBadge(m.role) + '</td>'
      + '<td>' + m.joined_at + '</td>'
      + '<td>' + m.last_active + '</td>'
      + '<td>' + actionCell + '</td>'
      + '</tr>';
  }

  html += '</tbody></table></div></div>';
  detail.innerHTML = html;
}

function backToList() {
  document.getElementById('memberDetail').style.display = 'none';
  document.getElementById('workspaceList').style.display = 'block';
}

renderWorkspaceList();
</script>
</body>
</html>
