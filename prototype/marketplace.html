<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuantMate - Strategy Marketplace</title>
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.tailwindcss.com?v=3.4"></script>
  <style>
    /* ── Filter Pills ── */
    .cat-btn, .type-btn {
      padding: 6px 16px; border-radius: 9999px; font-size: 0.8rem; font-weight: 500;
      border: 1px solid hsl(var(--border)); background: transparent;
      color: hsl(var(--muted-foreground)); cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .cat-btn:hover, .type-btn:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }
    .cat-btn.active {
      background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }
    .type-btn.active {
      background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }
    /* ── Grid ── */
    .tmpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .tmpl-card { display: flex; flex-direction: column; cursor: pointer; }
    .tmpl-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .tmpl-card .tmpl-desc {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; font-size: 0.8rem; color: hsl(var(--muted-foreground)); margin: 8px 0;
    }
    .tmpl-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .tmpl-tag {
      padding: 2px 8px; border-radius: 4px; font-size: 0.7rem;
      background: hsl(var(--muted)); color: hsl(var(--muted-foreground));
    }
    /* ── Type Badges ── */
    .badge-standalone { background: hsl(221 83% 92%); color: hsl(221 83% 40%); font-size: 11px; }
    .badge-component { font-size: 11px; }
    .badge-composite { background: linear-gradient(135deg, hsl(221 83% 92%), hsl(262 83% 92%)); color: hsl(262 60% 40%); font-size: 11px; }
    .dark .badge-standalone { background: hsl(221 40% 22%); color: hsl(221 83% 75%); }
    .dark .badge-composite { background: linear-gradient(135deg, hsl(221 40% 22%), hsl(262 40% 22%)); color: hsl(262 60% 75%); }
    .badge-universe { background: hsl(260 60% 92%); color: hsl(260 60% 40%); }
    .badge-trading { background: hsl(210 80% 92%); color: hsl(210 80% 35%); }
    .badge-risk { background: hsl(0 70% 92%); color: hsl(0 70% 40%); }
    .dark .badge-universe { background: hsl(260 40% 22%); color: hsl(260 60% 75%); }
    .dark .badge-trading { background: hsl(210 40% 22%); color: hsl(210 80% 75%); }
    .dark .badge-risk { background: hsl(0 40% 22%); color: hsl(0 70% 75%); }
    /* ── Pipeline Mini ── */
    .pipeline-mini { display: flex; align-items: center; gap: 4px; font-size: 11px; flex-wrap: wrap; margin: 6px 0; }
    .pipeline-mini .arrow { color: hsl(var(--muted-foreground)); font-weight: 700; }
    /* ── Pagination ── */
    .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 24px; }
    .page-btn {
      min-width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: calc(var(--radius) - 2px); font-size: 0.8rem; font-weight: 500;
      border: 1px solid hsl(var(--border)); background: transparent;
      color: hsl(var(--foreground)); cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .page-btn:hover { background: hsl(var(--accent)); }
    .page-btn.active { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: hsl(var(--primary)); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    /* ── Stats Row ── */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 1024px) { .tmpl-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .tmpl-grid { grid-template-columns: 1fr; } }
    /* ── Preview tabs ── */
    .preview-tab {
      padding: 10px 16px; font-size: 0.8rem; font-weight: 500; border: none; background: none;
      color: hsl(var(--muted-foreground)); cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .preview-tab:hover { color: hsl(var(--foreground)); }
    .preview-tab.active { color: hsl(var(--primary)); border-bottom-color: hsl(var(--primary)); }
    .btn-added { background: hsl(var(--muted)) !important; color: hsl(var(--muted-foreground)) !important; cursor: not-allowed; pointer-events: none; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="main">

    <div class="page-header">
      <h1 class="page-title">Strategy Marketplace</h1>
      <p class="page-subtitle">Discover high-quality strategy templates — import to your workspace and start trading</p>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Total Templates</div><div class="stat-value">32</div></div>
      <div class="stat-card"><div class="stat-label">Standalone</div><div class="stat-value">5</div></div>
      <div class="stat-card"><div class="stat-label">Components</div><div class="stat-value">23</div></div>
      <div class="stat-card"><div class="stat-label">Composites</div><div class="stat-value">4</div></div>
    </div>

    <!-- Search + Filters -->
    <div class="filter-bar" style="flex-direction:column;align-items:stretch;gap:12px">
      <input type="text" class="form-input" id="searchInput" placeholder="Search strategy templates..." style="max-width:400px">
      <!-- Template Type Filter -->
      <div id="typeBar" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      <!-- Category Filter -->
      <div id="catBar" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>

    <!-- Featured Banner -->
    <div id="featuredBanner"></div>

    <!-- Template Grid -->
    <div class="tmpl-grid" id="tmplGrid"></div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>

  </main>
</div>

<!-- Import Confirmation Modal -->
<div class="modal-overlay" id="importConfirmModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><h3 class="modal-title">Import Template</h3><button class="btn btn-ghost btn-icon" onclick="closeModal('importConfirmModal')">&#10005;</button></div>
    <div class="modal-body">
      <p style="font-size:14px;margin:0 0 12px">Import <strong id="importTmplName"></strong> as a private copy?</p>
      <div id="importTmplInfo" style="padding:12px;border:1px solid hsl(var(--border));border-radius:8px;background:hsl(var(--muted)/.2);margin-bottom:12px;font-size:13px"></div>
      <p class="text-muted" style="font-size:12px;margin:0">The template will be cloned to your workspace. You can edit and customize it freely.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('importConfirmModal')">Cancel</button>
      <button class="btn btn-primary" id="importConfirmBtn" onclick="confirmImport()">Import</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>

var ITEMS_PER_PAGE = 9;
var currentType = 'All';
var currentCategory = 'All';
var currentSearch = '';
var currentPage = 1;
var pendingImport = null;

/* ── Filtering ── */
function getFilteredTemplates() {
  var results = [];
  for (var i = 0; i < TEMPLATES.length; i++) {
    var t = TEMPLATES[i];
    var matchType = currentType === 'All' || t.templateType === currentType.toLowerCase();
    var matchCat = currentCategory === 'All' || t.category === currentCategory;
    var matchSearch = !currentSearch || t.name.toLowerCase().indexOf(currentSearch) !== -1
      || t.desc.toLowerCase().indexOf(currentSearch) !== -1
      || t.category.toLowerCase().indexOf(currentSearch) !== -1;
    if (matchType && matchCat && matchSearch) results.push(t);
  }
  return results;
}

/* ── Type Badge ── */
function typeBadge(t) {
  if (t.templateType === 'standalone') return '<span class="badge badge-standalone">Standalone</span>';
  if (t.templateType === 'composite') return '<span class="badge badge-composite">Composite</span>';
  if (t.templateType === 'component') {
    var cls = 'badge-' + t.layer;
    var label = t.layer.charAt(0).toUpperCase() + t.layer.slice(1);
    return '<span class="badge badge-component ' + cls + '">' + label + '</span>';
  }
  return '';
}

/* ── Category Badge ── */
function catBadgeClass(category) {
  var map = { 'CTA': 'badge-primary', 'Alpha': 'badge-success', 'Grid': 'badge-warning', 'Arbitrage': 'badge-destructive', 'AI/ML': 'badge-muted' };
  return map[category] || 'badge-muted';
}

/* ── Render: Type Filter Bar ── */
function renderTypeBar() {
  var html = '';
  for (var i = 0; i < TYPES.length; i++) {
    var t = TYPES[i];
    var cls = t === currentType ? 'type-btn active' : 'type-btn';
    var count = t === 'All' ? TEMPLATES.length : TEMPLATES.filter(function(x) { return x.templateType === t.toLowerCase(); }).length;
    html += '<button class="' + cls + '" data-type="' + t + '">' + t + ' <span style="opacity:.6;font-size:11px">(' + count + ')</span></button>';
  }
  document.getElementById('typeBar').innerHTML = html;
  var btns = document.getElementById('typeBar').querySelectorAll('.type-btn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].addEventListener('click', function() {
      currentType = this.getAttribute('data-type');
      currentPage = 1;
      render();
    });
  }
}

/* ── Render: Category Filter Bar ── */
function renderCategoryBar() {
  var html = '';
  for (var i = 0; i < CATEGORIES.length; i++) {
    var cat = CATEGORIES[i];
    var cls = cat === currentCategory ? 'cat-btn active' : 'cat-btn';
    html += '<button class="' + cls + '" data-cat="' + cat + '">' + cat + '</button>';
  }
  document.getElementById('catBar').innerHTML = html;
  var btns = document.getElementById('catBar').querySelectorAll('.cat-btn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].addEventListener('click', function() {
      currentCategory = this.getAttribute('data-cat');
      currentPage = 1;
      render();
    });
  }
}

/* ── Render: Featured Banner ── */
function renderFeatured() {
  var el = document.getElementById('featuredBanner');
  if (currentCategory !== 'All' || currentSearch || (currentType !== 'All' && currentType !== 'Composite')) {
    el.innerHTML = '';
    return;
  }
  var ft = null;
  for (var i = 0; i < TEMPLATES.length; i++) {
    if (TEMPLATES[i].featured && TEMPLATES[i].templateType === 'composite') { ft = TEMPLATES[i]; break; }
  }
  if (!ft) { el.innerHTML = ''; return; }

  var pipeHtml = '<span class="badge badge-universe">' + ft.pipeline.universe + '</span>'
    + '<span class="arrow"> &rarr; </span>'
    + '<span class="badge badge-trading">' + ft.pipeline.trading + '</span>'
    + '<span class="arrow"> &rarr; </span>'
    + '<span class="badge badge-risk">' + ft.pipeline.risk + '</span>';

  el.innerHTML = '<div class="card" style="background:linear-gradient(135deg,hsl(221 83% 53% / 0.08),hsl(262 83% 58% / 0.08));border:1px solid hsl(221 83% 53% / 0.25);margin-bottom:20px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">'
    + '<div style="flex:1;min-width:240px">'
    + '<div style="display:flex;gap:8px;margin-bottom:8px"><span class="badge badge-primary">' + icon('star') + ' Featured</span><span class="badge badge-composite">Composite</span></div>'
    + '<h3 style="font-weight:700;font-size:1.125rem;margin:4px 0">' + ft.name + '</h3>'
    + '<p class="text-muted" style="font-size:0.8rem;margin:4px 0 8px">' + ft.desc + '</p>'
    + '<div class="pipeline-mini" style="margin:8px 0">' + pipeHtml + '</div>'
    + '<div style="display:flex;gap:16px;font-size:0.8rem;color:hsl(var(--muted-foreground))">'
    + '<span>' + icon('star') + ' ' + ft.rating.toFixed(1) + '</span>'
    + '<span>' + icon('download') + ' ' + ft.downloads.toLocaleString() + '</span>'
    + '<span>' + ft.author + '</span>'
    + '</div>'
    + '</div>'
    + '<button class="btn btn-primary" onclick="openPreview(\'' + ft.name.replace(/'/g, "\\'") + '\')">Preview</button>'
    + '</div>'
    + '</div>';
}

/* ── Render: Grid ── */
function renderGrid() {
  var filtered = getFilteredTemplates();
  var totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  var start = (currentPage - 1) * ITEMS_PER_PAGE;
  var pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);

  var html = '';
  if (pageItems.length === 0) {
    html = '<div class="empty-state" style="grid-column:1/-1;padding:40px;text-align:center">' + icon('search') + '<p>No templates found matching your criteria</p></div>';
  }
  for (var i = 0; i < pageItems.length; i++) {
    var t = pageItems[i];
    var tagsHtml = '';
    for (var j = 0; j < t.tags.length; j++) {
      tagsHtml += '<span class="tmpl-tag">' + t.tags[j] + '</span>';
    }
    /* Pipeline preview for composite */
    var pipelineHtml = '';
    if (t.templateType === 'composite' && t.pipeline) {
      pipelineHtml = '<div class="pipeline-mini">'
        + '<span class="badge badge-universe" style="padding:2px 6px">' + t.pipeline.universe + '</span>'
        + '<span class="arrow">&rarr;</span>'
        + '<span class="badge badge-trading" style="padding:2px 6px">' + t.pipeline.trading + '</span>'
        + '<span class="arrow">&rarr;</span>'
        + '<span class="badge badge-risk" style="padding:2px 6px">' + t.pipeline.risk + '</span>'
        + '</div>';
    }
    /* Layer badge for component */
    var layerHtml = '';
    if (t.templateType === 'component' && t.subType) {
      layerHtml = '<span class="tmpl-tag" style="font-size:10px;text-transform:uppercase">' + t.subType + '</span>';
    }

    html += '<div class="card card-sm tmpl-card" onclick="openPreview(\'' + t.name.replace(/'/g, "\\'") + '\')">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
      + '<div style="display:flex;gap:6px;align-items:center">' + typeBadge(t) + '<span class="badge ' + catBadgeClass(t.category) + '">' + t.category + '</span></div>'
      + '<span style="font-size:0.75rem;color:hsl(var(--muted-foreground));display:flex;align-items:center;gap:4px">' + icon('star') + ' ' + t.rating.toFixed(1) + '</span>'
      + '</div>'
      + '<h4 style="font-weight:600;font-size:0.95rem;margin:4px 0">' + t.name + '</h4>'
      + '<p class="tmpl-desc">' + t.desc + '</p>'
      + pipelineHtml
      + '<div class="tmpl-tags">' + tagsHtml + layerHtml + '</div>'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid hsl(var(--border))">'
      + '<div style="font-size:0.75rem;color:hsl(var(--muted-foreground));display:flex;gap:12px">'
      + '<span>' + t.author + '</span>'
      + '<span>' + icon('download') + ' ' + t.downloads.toLocaleString() + '</span>'
      + '</div>'
      + (isInLibrary(t.name)
        ? '<button class="btn btn-outline btn-sm btn-added" disabled onclick="event.stopPropagation()">In Library</button>'
        : '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();importTemplate(\'' + t.name.replace(/'/g, "\\'") + '\')">Add to Library</button>')
      + '</div>'
      + '</div>';
  }
  document.getElementById('tmplGrid').innerHTML = html;
}

/* ── Render: Pagination ── */
function renderPagination() {
  var filtered = getFilteredTemplates();
  var totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  var html = '<button class="page-btn"' + (currentPage <= 1 ? ' disabled' : '') + ' data-page="prev">' + icon('chevron-right', 'transform:rotate(180deg)') + '</button>';
  for (var i = 1; i <= totalPages; i++) {
    html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
  }
  html += '<button class="page-btn"' + (currentPage >= totalPages ? ' disabled' : '') + ' data-page="next">' + icon('chevron-right') + '</button>';

  document.getElementById('pagination').innerHTML = html;
  var btns = document.getElementById('pagination').querySelectorAll('.page-btn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].addEventListener('click', function() {
      var p = this.getAttribute('data-page');
      if (p === 'prev') currentPage = Math.max(1, currentPage - 1);
      else if (p === 'next') currentPage = currentPage + 1;
      else currentPage = parseInt(p, 10);
      render();
    });
  }
}

/* ── Library tracking ── */
var librarySet = {};

function isInLibrary(name) { return !!librarySet[name]; }

/* ── Import Flow → now "Add to Template Library" ── */
function importTemplate(name) {
  var t = null;
  for (var i = 0; i < TEMPLATES.length; i++) { if (TEMPLATES[i].name === name) { t = TEMPLATES[i]; break; } }
  if (!t) return;
  if (isInLibrary(name)) return;
  librarySet[name] = true;
  showToast(t.name + ' added to Template Library!', 'success');
  render();
}

function confirmImport() {
  closeModal('importConfirmModal');
  if (!pendingImport) return;
  importTemplate(pendingImport.name);
  pendingImport = null;
}

/* ── Preview Drawer ── */
var currentPreview = null;

function openPreview(name) {
  var t = null;
  for (var i = 0; i < TEMPLATES.length; i++) { if (TEMPLATES[i].name === name) { t = TEMPLATES[i]; break; } }
  if (!t) return;
  currentPreview = t;
  document.getElementById('previewName').textContent = t.name;
  document.getElementById('previewBadges').innerHTML = typeBadge(t) + '<span class="badge ' + catBadgeClass(t.category) + '">' + t.category + '</span>';
  document.getElementById('previewMeta').innerHTML =
    '<span>' + icon('star') + ' ' + t.rating.toFixed(1) + '</span>'
    + '<span>' + icon('download') + ' ' + t.downloads.toLocaleString() + '</span>'
    + '<span>' + t.author + '</span>';
  document.getElementById('previewDesc').textContent = t.desc;
  var tagsHtml = '';
  for (var j = 0; j < t.tags.length; j++) { tagsHtml += '<span class="tmpl-tag">' + t.tags[j] + '</span>'; }
  document.getElementById('previewTags').innerHTML = tagsHtml;
  // Params
  var paramsBody = document.getElementById('previewParamsBody');
  paramsBody.innerHTML = '<tr><td style="padding:8px 12px;border-bottom:1px solid hsl(var(--border))">short_window</td><td style="padding:8px 12px;border-bottom:1px solid hsl(var(--border))">number</td><td style="padding:8px 12px;border-bottom:1px solid hsl(var(--border))">5</td></tr>'
    + '<tr><td style="padding:8px 12px;border-bottom:1px solid hsl(var(--border))">long_window</td><td style="padding:8px 12px;border-bottom:1px solid hsl(var(--border))">number</td><td style="padding:8px 12px;border-bottom:1px solid hsl(var(--border))">20</td></tr>';
  // Button state
  var addBtn = document.getElementById('previewAddBtn');
  if (isInLibrary(t.name)) {
    addBtn.textContent = 'Already in Template Library';
    addBtn.classList.add('btn-added');
  } else {
    addBtn.textContent = 'Add to Template Library';
    addBtn.classList.remove('btn-added');
  }
  switchPreviewTab('desc');
  openModal('previewDrawer');
}

function closePreview() { closeModal('previewDrawer'); currentPreview = null; }

function switchPreviewTab(tab) {
  var tabs = document.querySelectorAll('.preview-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-ptab') === tab);
  }
  document.getElementById('previewDescPanel').style.display = tab === 'desc' ? '' : 'none';
  document.getElementById('previewCodePanel').style.display = tab === 'code' ? '' : 'none';
  document.getElementById('previewParamsPanel').style.display = tab === 'params' ? '' : 'none';
}

function addToLibraryFromPreview() {
  if (!currentPreview || isInLibrary(currentPreview.name)) return;
  importTemplate(currentPreview.name);
  var addBtn = document.getElementById('previewAddBtn');
  addBtn.textContent = 'Already in Template Library';
  addBtn.classList.add('btn-added');
}

/* ── Main Render ── */
function render() {
  renderTypeBar();
  renderCategoryBar();
  renderFeatured();
  renderGrid();
  renderPagination();
}

document.getElementById('searchInput').addEventListener('input', function() {
  currentSearch = this.value.toLowerCase().trim();
  currentPage = 1;
  render();
});

render();
</script>
