<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuantMate - Strategy Marketplace</title>
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.tailwindcss.com?v=3.4"></script>
  <style>
    .cat-btn {
      padding: 6px 16px; border-radius: 9999px; font-size: 0.8rem; font-weight: 500;
      border: 1px solid hsl(var(--border)); background: transparent;
      color: hsl(var(--muted-foreground)); cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .cat-btn:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }
    .cat-btn.active {
      background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }
    .tmpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .tmpl-card { display: flex; flex-direction: column; }
    .tmpl-card .tmpl-desc {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; font-size: 0.8rem; color: hsl(var(--muted-foreground)); margin: 8px 0;
    }
    .tmpl-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .tmpl-tag {
      padding: 2px 8px; border-radius: 4px; font-size: 0.7rem;
      background: hsl(var(--muted)); color: hsl(var(--muted-foreground));
    }
    .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 24px; }
    .page-btn {
      min-width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: calc(var(--radius) - 2px); font-size: 0.8rem; font-weight: 500;
      border: 1px solid hsl(var(--border)); background: transparent;
      color: hsl(var(--foreground)); cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .page-btn:hover { background: hsl(var(--accent)); }
    .page-btn.active { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: hsl(var(--primary)); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    @media (max-width: 1024px) { .tmpl-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .tmpl-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="main">

    <div class="page-header">
      <h1 class="page-title">Strategy Marketplace</h1>
      <p class="page-subtitle">Discover high-quality strategy templates and deploy in one click</p>
    </div>

    <!-- Search + Category Filters -->
    <div class="filter-bar" style="flex-direction:column;align-items:stretch;gap:12px">
      <input type="text" class="form-input" id="searchInput" placeholder="Search strategy templates..." style="max-width:400px">
      <div id="catBar" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>

    <!-- Featured Banner -->
    <div id="featuredBanner"></div>

    <!-- Template Grid -->
    <div class="tmpl-grid" id="tmplGrid"></div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>

  </main>
</div>

<script src="shared.js"></script>
<script>
var CATEGORIES = ['All', 'Trend Following', 'Mean Reversion', 'Multi-Factor', 'Arbitrage', 'High Frequency', 'Machine Learning'];

var TEMPLATES = [
  {
    name: 'Dual MA Crossover',
    category: 'Trend Following',
    rating: 4.8,
    downloads: 2340,
    author: 'quant_master',
    desc: 'Classic dual moving average crossover strategy with optimized entry/exit signals. Supports multiple timeframes and adaptive period tuning.',
    tags: ['Moving Average', 'Trend', 'Beginner Friendly'],
    featured: true
  },
  {
    name: 'RSI Mean Reversion',
    category: 'Mean Reversion',
    rating: 4.5,
    downloads: 1856,
    author: 'alpha_seeker',
    desc: 'RSI-based mean reversion strategy with dynamic overbought/oversold thresholds. Includes volume confirmation filter.',
    tags: ['RSI', 'Mean Reversion', 'Volume']
  },
  {
    name: 'Multi-Factor Alpha',
    category: 'Multi-Factor',
    rating: 4.7,
    downloads: 1425,
    author: 'factor_lab',
    desc: 'Combines momentum, value, quality and size factors with IC-weighted dynamic allocation. Backtested annualized return of 28.5%.',
    tags: ['Multi-Factor', 'Alpha', 'Stock Selection']
  },
  {
    name: 'Statistical Arbitrage',
    category: 'Arbitrage',
    rating: 4.3,
    downloads: 980,
    author: 'pair_trader',
    desc: 'Cointegration-based statistical arbitrage for correlated pairs. Automatic pair detection and spread z-score trading.',
    tags: ['Pairs Trading', 'Cointegration', 'Market Neutral']
  },
  {
    name: 'LSTM Price Predictor',
    category: 'Machine Learning',
    rating: 4.6,
    downloads: 1120,
    author: 'ml_quant',
    desc: 'LSTM neural network for short-term price prediction. Integrates technical indicators and sentiment features as input.',
    tags: ['LSTM', 'Deep Learning', 'Prediction']
  },
  {
    name: 'Grid Trading Bot',
    category: 'High Frequency',
    rating: 4.2,
    downloads: 760,
    author: 'grid_master',
    desc: 'Dynamic grid trading strategy for range-bound markets. Auto-adjusts grid spacing based on realized volatility.',
    tags: ['Grid', 'Market Making', 'Volatility']
  },
  {
    name: 'Bollinger Breakout',
    category: 'Trend Following',
    rating: 4.1,
    downloads: 1530,
    author: 'breakout_pro',
    desc: 'Bollinger Band breakout strategy with ATR-based stop loss and trailing take profit. Optimized for intraday trading.',
    tags: ['Bollinger', 'Breakout', 'ATR']
  },
  {
    name: 'XGBoost Ranker',
    category: 'Machine Learning',
    rating: 4.4,
    downloads: 890,
    author: 'ml_quant',
    desc: 'XGBoost-based cross-sectional stock ranking model. Features engineered from 60+ technical and fundamental factors.',
    tags: ['XGBoost', 'Ranking', 'Feature Engineering']
  }
];

var ITEMS_PER_PAGE = 6;
var currentCategory = 'All';
var currentSearch = '';
var currentPage = 1;

function getFilteredTemplates() {
  var results = [];
  for (var i = 0; i < TEMPLATES.length; i++) {
    var t = TEMPLATES[i];
    var matchCat = currentCategory === 'All' || t.category === currentCategory;
    var matchSearch = !currentSearch || t.name.toLowerCase().indexOf(currentSearch) !== -1 || t.desc.toLowerCase().indexOf(currentSearch) !== -1 || t.category.toLowerCase().indexOf(currentSearch) !== -1;
    if (matchCat && matchSearch) results.push(t);
  }
  return results;
}

function renderStars(rating) {
  return icon('star', '') + ' ' + rating.toFixed(1);
}

function renderCategoryBar() {
  var html = '';
  for (var i = 0; i < CATEGORIES.length; i++) {
    var cat = CATEGORIES[i];
    var cls = cat === currentCategory ? 'cat-btn active' : 'cat-btn';
    html += '<button class="' + cls + '" data-cat="' + cat + '">' + cat + '</button>';
  }
  document.getElementById('catBar').innerHTML = html;

  var btns = document.getElementById('catBar').querySelectorAll('.cat-btn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].addEventListener('click', function() {
      currentCategory = this.getAttribute('data-cat');
      currentPage = 1;
      render();
    });
  }
}

function renderFeatured() {
  var el = document.getElementById('featuredBanner');
  if (currentCategory !== 'All' || currentSearch) {
    el.innerHTML = '';
    return;
  }
  var ft = null;
  for (var i = 0; i < TEMPLATES.length; i++) {
    if (TEMPLATES[i].featured) { ft = TEMPLATES[i]; break; }
  }
  if (!ft) { el.innerHTML = ''; return; }

  el.innerHTML = '<div class="card" style="background:linear-gradient(135deg,hsl(221 83% 53% / 0.08),hsl(262 83% 58% / 0.08));border:1px solid hsl(221 83% 53% / 0.25);margin-bottom:20px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">'
    + '<div style="flex:1;min-width:240px">'
    + '<span class="badge badge-primary" style="margin-bottom:8px">' + icon('star') + ' Featured</span>'
    + '<h3 style="font-weight:700;font-size:1.125rem;margin:8px 0 4px">' + ft.name + '</h3>'
    + '<p class="text-muted" style="font-size:0.8rem;margin:4px 0 8px">' + ft.desc + '</p>'
    + '<div style="display:flex;gap:16px;font-size:0.8rem;color:hsl(var(--muted-foreground))">'
    + '<span>' + icon('star') + ' ' + ft.rating.toFixed(1) + '</span>'
    + '<span>' + icon('download') + ' ' + ft.downloads.toLocaleString() + '</span>'
    + '<span>' + ft.author + '</span>'
    + '</div>'
    + '</div>'
    + '<button class="btn btn-primary" onclick="showToast(\'' + ft.name + ' template added to your workspace\', \'success\')">Use Template</button>'
    + '</div>'
    + '</div>';
}

function badgeClass(category) {
  var map = {
    'Trend Following': 'badge-primary',
    'Mean Reversion': 'badge-success',
    'Multi-Factor': 'badge-warning',
    'Arbitrage': 'badge-destructive',
    'High Frequency': 'badge-muted',
    'Machine Learning': 'bg-purple'
  };
  return map[category] || 'badge-muted';
}

function renderGrid() {
  var filtered = getFilteredTemplates();
  var totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  var start = (currentPage - 1) * ITEMS_PER_PAGE;
  var pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);

  var html = '';
  if (pageItems.length === 0) {
    html = '<div class="empty-state" style="grid-column:1/-1">' + icon('search') + '<p>No templates found matching your criteria</p></div>';
  }
  for (var i = 0; i < pageItems.length; i++) {
    var t = pageItems[i];
    var tagsHtml = '';
    for (var j = 0; j < t.tags.length; j++) {
      tagsHtml += '<span class="tmpl-tag">' + t.tags[j] + '</span>';
    }
    html += '<div class="card card-sm tmpl-card">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
      + '<span class="badge ' + badgeClass(t.category) + '">' + t.category + '</span>'
      + '<span style="font-size:0.75rem;color:hsl(var(--muted-foreground));display:flex;align-items:center;gap:4px">' + icon('star') + ' ' + t.rating.toFixed(1) + '</span>'
      + '</div>'
      + '<h4 style="font-weight:600;font-size:0.95rem;margin:4px 0">' + t.name + '</h4>'
      + '<p class="tmpl-desc">' + t.desc + '</p>'
      + '<div class="tmpl-tags">' + tagsHtml + '</div>'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid hsl(var(--border))">'
      + '<div style="font-size:0.75rem;color:hsl(var(--muted-foreground));display:flex;gap:12px">'
      + '<span>' + t.author + '</span>'
      + '<span>' + icon('download') + ' ' + t.downloads.toLocaleString() + '</span>'
      + '</div>'
      + '<button class="btn btn-outline btn-sm" onclick="showToast(\'' + t.name + ' template added to your workspace\', \'success\')">Use Template</button>'
      + '</div>'
      + '</div>';
  }
  document.getElementById('tmplGrid').innerHTML = html;
}

function renderPagination() {
  var filtered = getFilteredTemplates();
  var totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  var html = '<button class="page-btn"' + (currentPage <= 1 ? ' disabled' : '') + ' data-page="prev">' + icon('chevron-right', 'transform:rotate(180deg)') + '</button>';
  for (var i = 1; i <= totalPages; i++) {
    html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
  }
  html += '<button class="page-btn"' + (currentPage >= totalPages ? ' disabled' : '') + ' data-page="next">' + icon('chevron-right') + '</button>';

  document.getElementById('pagination').innerHTML = html;

  var btns = document.getElementById('pagination').querySelectorAll('.page-btn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].addEventListener('click', function() {
      var p = this.getAttribute('data-page');
      if (p === 'prev') currentPage = Math.max(1, currentPage - 1);
      else if (p === 'next') currentPage = currentPage + 1;
      else currentPage = parseInt(p, 10);
      render();
    });
  }
}

function render() {
  renderCategoryBar();
  renderFeatured();
  renderGrid();
  renderPagination();
}

document.getElementById('searchInput').addEventListener('input', function() {
  currentSearch = this.value.toLowerCase().trim();
  currentPage = 1;
  render();
});

render();
</script>
</body>
</html>
