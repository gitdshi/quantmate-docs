<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuantMate — Change Password</title>
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.tailwindcss.com?v=3.4"></script>
  <style>
    .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:hsl(var(--background));padding:16px}
    .auth-card{width:100%;max-width:460px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:16px;padding:32px;box-shadow:0 10px 30px hsl(var(--foreground)/.08)}
  </style>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div style="display:flex;justify-content:center;margin-bottom:20px;color:hsl(var(--primary))">${icon('lock')}</div>
    <h1 style="font-size:28px;font-weight:700;text-align:center;margin:0 0 8px">Change Password</h1>
    <p class="text-muted" style="text-align:center;margin:0 0 24px">Update your password before continuing back to the main workspace.</p>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div><label class="form-label">Current Password</label><input class="form-input" type="password"></div>
      <div><label class="form-label">New Password</label><input class="form-input" type="password"></div>
      <div><label class="form-label">Confirm New Password</label><input class="form-input" type="password"></div>
      <button class="btn btn-primary" style="width:100%" onclick="showToast('Password updated','success')">Update Password</button>
    </div>
    <p style="margin:20px 0 0;text-align:center;font-size:14px;color:hsl(var(--muted-foreground))"><a href="login.html" style="color:hsl(var(--primary));text-decoration:none;font-weight:600">Back to Login</a></p>
  </div>
</div>
<script src="shared.js"></script>
</body>
</html>
